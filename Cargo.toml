[package]
name = "ada_fw"
version = "0.1.0"
edition = "2021"
description = "A server-side rendering frontend framework built with Rust, Minijinja, Tailwind CSS and Alpine.js"
license = "MIT"

[dependencies]
# HTTP 服务
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace"] }

# 模板引擎
minijinja = { version = "2", features = ["loader", "json"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 工具
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
