[package]
name = "ada_fw"
version = "0.1.0"
edition = "2021"
description = "A server-side rendering frontend framework built with Rust, Minijinja, Tailwind CSS and Alpine.js"
license = "MIT"

[dependencies]
# HTTP 服务
axum = "0.7"
axum-extra = { version = "0.9", features = ["cookie", "cookie-private"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "limit", "set-header"] }

# 模板引擎
minijinja = { version = "2", features = ["loader", "json"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 鉴权
jsonwebtoken = "9"
time = "0.3"

# 数据库
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# 文件监听（模板热重载）
notify = "6"

# 工具
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.4", features = ["util"] }
