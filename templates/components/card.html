{# 通用卡片组件（站内公开页） #}
{% macro render(title, subtitle="") %}
<section class="card overflow-hidden">
  <header class="border-b border-border px-5 py-4">
    <h2 class="text-[15px] font-semibold tracking-tight text-content">{{ title }}</h2>
    {% if subtitle %}
    <p class="mt-0.5 text-xs text-content-muted">{{ subtitle }}</p>
    {% endif %}
  </header>
  <div class="p-5">{{ caller() }}</div>
</section>
{% endmacro %}
