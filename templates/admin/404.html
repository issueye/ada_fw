<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" x-data="adminLayout()" x-init="init()">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} · Ada Admin</title>

  <script>
    (function () {
      var saved = localStorage.getItem('ada-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>

  {% if tailwind_mode == "cdn" %}
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['selector', '[data-theme="dark"]'],
      theme: { extend: {
        colors: {
          primary: { subtle: 'var(--color-primary-subtle)', muted: 'var(--color-primary-muted)', DEFAULT: 'var(--color-primary)', hover: 'var(--color-primary-hover)', active: 'var(--color-primary-active)', fg: 'var(--color-primary-fg)' },
          success: { subtle: 'var(--color-success-subtle)', muted: 'var(--color-success-muted)', DEFAULT: 'var(--color-success)', fg: 'var(--color-success-fg)' },
          warning: { subtle: 'var(--color-warning-subtle)', muted: 'var(--color-warning-muted)', DEFAULT: 'var(--color-warning)', fg: 'var(--color-warning-fg)' },
          danger: { subtle: 'var(--color-danger-subtle)', muted: 'var(--color-danger-muted)', DEFAULT: 'var(--color-danger)', hover: 'var(--color-danger-hover)', fg: 'var(--color-danger-fg)' },
          info: { subtle: 'var(--color-info-subtle)', muted: 'var(--color-info-muted)', DEFAULT: 'var(--color-info)', fg: 'var(--color-info-fg)' },
          bg: 'var(--color-bg)',
          surface: { DEFAULT: 'var(--color-surface)', hover: 'var(--color-surface-hover)', active: 'var(--color-surface-active)' },
          border: { DEFAULT: 'var(--color-border)', strong: 'var(--color-border-strong)' },
          content: { DEFAULT: 'var(--color-text)', secondary: 'var(--color-text-secondary)', muted: 'var(--color-text-muted)', inverse: 'var(--color-text-inverse)' }
        },
        borderRadius: { sm: 'var(--radius-sm)', md: 'var(--radius-md)', lg: 'var(--radius-lg)', xl: 'var(--radius-xl)' },
        boxShadow: { xs: 'var(--shadow-xs)', sm: 'var(--shadow-sm)', md: 'var(--shadow-md)', lg: 'var(--shadow-lg)', xl: 'var(--shadow-xl)' }
      }}
    };
  </script>
  {% else %}
  <link rel="stylesheet" href="{{ asset('css/app.css') | safe }}">
  {% endif %}

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script defer src="{{ asset('js/app.js') | safe }}"></script>
</head>
<body class="min-h-screen bg-bg text-content">
  <div class="flex min-h-screen flex-col items-center justify-center px-4 py-12">
    <div class="w-full max-w-md text-center">
      {# 404 图形 #}
      <div class="mb-8">
        <p class="select-none text-8xl font-bold tracking-tighter text-primary/20">404</p>
      </div>

      <h1 class="text-2xl font-semibold tracking-tight text-content">页面不存在</h1>
      <p class="mt-2 text-sm text-content-secondary">
        抱歉，你访问的页面已被移除、重命名，或暂时不可用。
      </p>

      <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
        <a href="/admin"
           class="inline-flex h-9 items-center gap-2 rounded-md bg-primary px-4 text-sm font-medium text-primary-fg shadow-xs transition-colors duration-base hover:bg-primary-hover focus-ring">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/>
          </svg>
          返回首页
        </a>
        <button type="button" onclick="history.back()"
                class="inline-flex h-9 items-center gap-2 rounded-md border border-border-strong bg-surface px-4 text-sm font-medium text-content transition-colors duration-base hover:bg-surface-hover focus-ring">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          返回上一页
        </button>
      </div>

      {# 常用链接 #}
      <div class="mt-12 border-t border-border pt-6">
        <p class="mb-3 text-xs font-medium uppercase tracking-wide text-content-muted">常用链接</p>
        <div class="flex flex-wrap items-center justify-center gap-x-6 gap-y-2">
          <a href="/admin" class="text-sm text-content-secondary transition-colors duration-fast hover:text-primary">仪表盘</a>
          <a href="/admin/users" class="text-sm text-content-secondary transition-colors duration-fast hover:text-primary">用户管理</a>
          <a href="/admin/ui-kit" class="text-sm text-content-secondary transition-colors duration-fast hover:text-primary">组件库</a>
          <a href="/admin/settings" class="text-sm text-content-secondary transition-colors duration-fast hover:text-primary">设置</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
