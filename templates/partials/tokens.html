{# ==========================================================================
   设计令牌与组件层样式片段
   - CDN 模式：内联为 <style>（tokens.css 与 components.css 不会被单独加载）
   - 本地模式：由 app.css（@import tokens.css + components.css）提供，无需内联

   重要：CSS 内容由 Rust 侧通过 `include_str!` 在编译期嵌入，
   保证与本地构建产物**同源**，不存在手工副本脱节问题。
   用法：{% include "partials/tokens.html" %}
   ========================================================================== #}
{% if tailwind_mode == "cdn" %}
<style>
{{ tokens_css | safe }}
{{ components_css | safe }}

/* ---- 基础样式（CDN 模式下 Tailwind preflight 之外的补充） ---- */
[x-cloak] { display: none !important; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--color-border-strong);
  border: 3px solid transparent;
  background-clip: content-box;
  border-radius: 9999px;
}
::-webkit-scrollbar-thumb:hover { background: var(--color-text-muted); background-clip: content-box; }

/* ---- 动画 ----
   说明：CDN 模式不解析 tailwind.config.js 的 keyframes，
   因此动画类必须在此内联，与 tailwind.config.js 保持一致。 */
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes scale-in { from { opacity: 0; transform: scale(0.96) translateY(4px); } to { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes slide-in-right { from { transform: translateX(100%); } to { transform: translateX(0); } }
@keyframes slide-in-left { from { transform: translateX(-100%); } to { transform: translateX(0); } }
@keyframes slide-in-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes slide-in-down { from { transform: translateY(-100%); } to { transform: translateY(0); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(-10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes draw-in { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }

.animate-fade-in { animation: fade-in var(--duration-base) var(--ease-out); }
.animate-scale-in { animation: scale-in var(--duration-base) var(--ease-out); }
.animate-slide-in-right { animation: slide-in-right var(--duration-slow) var(--ease-out); }
.animate-slide-in-left { animation: slide-in-left var(--duration-slow) var(--ease-out); }
.animate-slide-in-up { animation: slide-in-up var(--duration-slow) var(--ease-out); }
.animate-slide-in-down { animation: slide-in-down var(--duration-slow) var(--ease-out); }
.animate-toast-in { animation: toast-in var(--duration-base) var(--ease-out); }
.animate-draw-in { animation: draw-in 1s var(--ease-out) both; }
</style>
{% endif %}
